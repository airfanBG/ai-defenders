<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Списък на участниците</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Manrope:wght@600;800&family=Unbounded:wght@800;900&display=swap&subset=cyrillic" rel="stylesheet" crossorigin="anonymous">
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #444; font-family: Manrope, sans-serif; color: #111; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .toolbar { position: sticky; top: 0; z-index: 5; background: #111; color: #fff3b0; padding: 12px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font: 600 15px Manrope, sans-serif; }
  .toolbar button { font: 800 15px Manrope, sans-serif; background: #ff5ca8; color: #111; border: 3px solid #fff3b0; padding: 8px 16px; cursor: pointer; }
  .toolbar select, .toolbar input[type=number] { font: 600 14px Manrope, sans-serif; padding: 5px 8px; border: 2px solid #fff3b0; background: #222; color: #fff3b0; }
  .toolbar input[type=number] { width: 4em; }
  .toolbar label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .note { padding: 40px; color: #fff; font: 600 18px Manrope, sans-serif; }

  .sheet { width: 210mm; height: 297mm; margin: 12px auto; background: #fff; padding: 12mm 12mm 10mm; display: flex; flex-direction: column; overflow: hidden; }
  .top { display: flex; justify-content: space-between; font: 700 3.2mm "JetBrains Mono", monospace; border-bottom: 0.6mm solid #111; padding-bottom: 2mm; }
  h1 { font: 900 8mm/1.1 Unbounded, sans-serif; margin: 4mm 0 1mm; }
  .sub { font: 600 3.4mm Manrope, sans-serif; color: #555; margin-bottom: 3mm; }
  table { width: 100%; border-collapse: collapse; font-size: 3.5mm; }
  th { font: 700 2.7mm "JetBrains Mono", monospace; text-align: left; padding: 1.5mm 1.5mm; border-bottom: 0.6mm solid #111; white-space: nowrap; }
  td { padding: 0 1.5mm; height: 8.2mm; border-bottom: 0.25mm solid #ccc; vertical-align: middle; }
  td.n { font: 700 3mm "JetBrains Mono", monospace; color: #777; width: 8mm; }
  td.name { font-weight: 800; }
  td.team { color: #333; }
  td.tbl { width: 12mm; text-align: center; }
  td.tbl b { display: inline-block; min-width: 7mm; padding: 0.4mm 1mm; background: var(--c, #eee); border: 0.3mm solid #111; font: 800 3.2mm Manrope, sans-serif; }
  td.small { font-size: 3mm; color: #444; }
  td.box { width: 13mm; text-align: center; }
  td.box span { display: inline-block; width: 4.5mm; height: 4.5mm; border: 0.4mm solid #111; }
  td.sign { width: 34mm; }
  tr.first td { border-top: 0.5mm solid #111; }
  tr.blank td.name { color: #bbb; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; font: 700 2.8mm "JetBrains Mono", monospace; color: #777; padding-top: 3mm; }

  @media print {
    body { background: #fff; }
    .toolbar, .note { display: none; }
    .sheet { margin: 0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <span id="info">Зареждане…</span>
  <label>Подредба <select id="sort">
    <option value="table">по маси (за регистрацията)</option>
    <option value="name">по име (за сертификатите)</option>
  </select></label>
  <label>Празни редове <input type="number" id="blank" value="4" min="0" max="40"></label>
  <label><input type="checkbox" id="colSchool" checked> специалност</label>
  <label><input type="checkbox" id="colSign" checked> подпис</label>
  <button style="background:#7cd3ff" id="csvBtn">⬇️ Excel (CSV)</button>
  <button id="pdfBtn" style="background:#b4f07a" onclick="downloadPdf(this, 'uchastnici.pdf')">⬇️ Свали PDF</button>
  <button onclick="window.print()">🖨️ Печат</button>
</div>
<div id="cards"></div>

<script src="pdf-export.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COLORS = ["#ff5ca8", "#7cd3ff", "#b4f07a", "#ffa94d", "#c3b1ff"];
const pad = (n) => String(n).padStart(2, "0");
const PER_PAGE = 27;
let people = [], teamCount = 0, event = "";

function note(text) { $("#info").textContent = ""; $("#cards").innerHTML = `<p class="note">${esc(text)}</p>`; }

function sorted() {
  const list = [...people];
  if ($("#sort").value === "name") list.sort((a, b) => a.name.localeCompare(b.name, "bg"));
  return list;
}

function render() {
  const list = sorted();
  const blanks = Math.max(0, Math.min(40, Number($("#blank").value) || 0));
  const rows = [...list, ...Array.from({ length: blanks }, () => null)];
  const school = $("#colSchool").checked, sign = $("#colSign").checked;
  const byTable = $("#sort").value === "table";
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  let html = "";
  for (let p = 0; p < pages; p++) {
    const chunk = rows.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
    html += `<div class="sheet">
      <div class="top"><span>${esc(event)}</span><span>// участници${pages > 1 ? ` · ${p + 1}/${pages}` : ""}</span></div>
      ${p === 0 ? `<h1>Участници</h1><div class="sub">${list.length} души в ${teamCount} екипа · ${byTable ? "подредени по маси" : "подредени по име"}. Отбележете ✓ при идване.</div>` : ""}
      <table><thead><tr><th>№</th><th>Име и фамилия</th><th>Екип</th><th>Маса</th>${school ? "<th>Специалност</th>" : ""}<th>Дошъл</th>${sign ? "<th>Подпис</th>" : ""}</tr></thead><tbody>
      ${chunk.map((m, k) => {
        const i = p * PER_PAGE + k;
        if (!m) return `<tr class="blank"><td class="n">${i + 1}</td><td class="name"></td><td class="team"></td><td class="tbl"></td>${school ? "<td></td>" : ""}<td class="box"><span></span></td>${sign ? '<td class="sign"></td>' : ""}</tr>`;
        const prev = i > 0 ? rows[i - 1] : null;
        const first = byTable && k > 0 && prev && prev.table !== m.table;
        return `<tr class="${first ? "first" : ""}"><td class="n">${i + 1}</td><td class="name">${esc(m.name)}</td><td class="team">${esc(m.team)}</td>
          <td class="tbl"><b style="--c:${COLORS[(m.table - 1) % COLORS.length]}">${m.table}</b></td>
          ${school ? `<td class="small">${esc([m.school, m.grade].filter(Boolean).join(", "))}</td>` : ""}
          <td class="box"><span></span></td>${sign ? '<td class="sign"></td>' : ""}</tr>`;
      }).join("")}
      </tbody></table>
      <div class="foot"><span>${esc(event)}</span><span>стр. ${p + 1} от ${pages}</span></div>
    </div>`;
  }
  $("#cards").innerHTML = html;
  $("#info").textContent = `${list.length} участници · ${teamCount} екипа · ${pages} стр.`;
}

function downloadCsv() {
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["№", "Име", "Екип", "Маса", "Имейл", "Специалност/училище/работа", "Курс/клас", "Дошъл", "Сертификат"];
  const rows = [head, ...sorted().map((m, i) => [i + 1, m.name, m.team, m.table, m.email, m.school, m.grade, "", ""])];
  const blob = new Blob(["﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "uchastnici.csv" });
  a.click();
  URL.revokeObjectURL(a.href);
}

async function main() {
  let password = "";
  try { password = sessionStorage.getItem("adminPw") || ""; } catch {}
  if (!password) return note("Първо влез в админа (/admin.html) в този браузър и отвори списъка оттам.");
  const auth = { headers: { authorization: "Bearer " + password } };
  const [tRes, settings] = await Promise.all([fetch("/api/admin/teams", auth), fetch("/api/settings").then((r) => r.json())]);
  if (tRes.status === 401) return note("Сесията в админа е изтекла. Влез отново и отвори списъка оттам.");
  // Същата подредба като табелките, за да съвпадат номерата на масите.
  const teams = (await tRes.json()).teams
    .filter((t) => t.status === "approved")
    .sort((a, b) => a.name.localeCompare(b.name, "bg"));
  if (!teams.length) return note("Още няма одобрени екипи.");
  teamCount = teams.length;
  people = teams.flatMap((t, i) => t.members.map((m) => ({ ...m, team: t.name, table: i + 1 })));
  const d = new Date(settings.start);
  event = `${settings.name} · ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
  ["#sort", "#colSchool", "#colSign"].forEach((s) => $(s).addEventListener("change", render));
  $("#blank").addEventListener("input", render);
  $("#csvBtn").addEventListener("click", downloadCsv);
  await document.fonts.ready;
  render();
}

main().catch((e) => note("Грешка: " + e.message));
</script>
</body>
</html>
